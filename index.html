const BANK=[{"q": "Tôn chỉ về sự phát triển của Sun Group là gì?", "opts": ["Phát triển hài hòa", "Phát triển bền vững", "Phát triển nhanh, mạnh và hài hòa", "Phát triển nhanh mạnh và dẫn đầu mọi lĩnh vực đầu tư mà Sun Group tham gia"], "answer": 1}, {"q": "Với định hướng “thượng tôn pháp luật”, Sun Group cần kiên định thực thi xây dựng những công trình như thế nào để củng cố hơn nữa sự tin tưởng của khách hàng?", "opts": ["Đảm bảo Giá trị cốt lõi Chất lượng và Khác biệt", "Đảm bảo Giá trị cốt lõi Sun Group: Chất lượng - Đẳng cấp - Khác biệt", "Bền vững với thời gian", "Ghi dấu ấn vượt thời gian"], "answer": 1}, {"q": "\"Chất lượng - Đẳng cấp - Khác biệt\" thể hiện nội dung gì trong Tư tưởng - Văn hóa Sun Group?", "opts": ["Lý tưởng Sun Group.", "Sứ mệnh Sun Group.", "Tầm nhìn Sun Group.", "Giá trị cốt lõi đối với Tập đoàn Sun Group."], "answer": 3}, {"q": "“Văn hóa Sun Group đã, đang và sẽ tiếp tục được bổ sung các tiêu chí văn hóa hiện đại, nhằm đảm bảo sự hội nhập của Sun Group cũng như Người Sun Group với môi trường phát triển năng động, văn minh và hiện đại của thế giới.” Đây là nội dung của yếu tố văn hóa nào của Sun Group?", "opts": ["Lan tỏa", "Kế thừa", "Hội nhập", "Bản sắc"], "answer": 2}, {"q": "Triết lý về Người Sun Group đã định nghĩa rõ về tiêu chí HIỀN và TÀI; theo đó tiêu chí HIỀN được mô tả như thế nào?", "opts": ["Luôn hành động theo những giá trị cốt lõi của Người Sun Group, tự hào làm gương, chia sẻ niềm tin, lan tỏa giá trị của Sun Group tới đồng nghiệp", "Vượt trội trong năng lực chuyên môn, hướng đến đa năng, có thể làm nhiều việc với hiệu quả cao", "Sống văn minh, cởi mở học hỏi, hoàn thiện bản thân để theo kịp với thời cuộc và sự phát triển của tổ chức, của xã hội", "Vừa sống khiêm nhường, trung thực, tự trọng vừa hết lòng hỗ trợ, động viên đồng nghiệp với tinh thần trách nhiệm vì tập thể và vì cộng đồng"], "answer": 3}, {"q": "Nội dung nào sau đây KHÔNG thể hiện sứ mệnh Sun Group?", "opts": ["Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc và đưa Việt Nam trở thành điểm đến hấp dẫn của thế giới.", "Tiên phong trong việc xây dựng văn hóa du lịch: văn minh, chuyên nghiệp và nhân văn ở Việt Nam.", "Góp phần xây dựng Người Việt Nam mới với phẩm chất, năng lực và sức khỏe bắt kịp thời cuộc.", "Tìm đến những vùng đất giàu tiềm năng nhưng chưa được khai thác đúng tầm, làm thay đổi những vùng đất ấy, kiến tạo và đóng góp cho xã hội những công trình, sản phẩm/dịch vụ có đẳng cấp chất lượng vượt trội, trường tồn theo thời gian."], "answer": 1}, {"q": "Nội dung nào sau đây KHÔNG thể hiện Triết lý về Người Sun Group?", "opts": ["Hiền tài của Sun Group hiểu được tầm quan trọng của văn hóa mang đậm bản sắc Sun Group đối với sự phát triển bền vững của Sun Group trong tương lai lâu dài.", "Hiền tài của Sun Group hiểu được công việc tại Sun Group cũng chính là cuộc sống mà họ vừa cống hiến hết mình vừa sống chân thành, yêu thương, quan tâm tới đồng nghiệp.", "Hiền tài của Sun Group là những người hiểu được trách nhiệm và sự đóng góp của bản thân đối với sự thành công và lớn mạnh của Sun Group.", "Sun Group luôn xác định một tư tưởng “Sun Group không giữ người bằng tiền và không đón nhận những người đến với Tập đoàn chỉ vì tiền”."], "answer": 3}, {"q": "Văn hóa Sun Group đã, đang và sẽ tiếp tục được bổ sung các tiêu chí văn hóa nào nhằm đảm bảo sự hội nhập của Sun Group cũng như Người Sun Group với môi trường phát triển năng động, văn minh và hiện đại của thế giới?", "opts": ["Văn hóa truyền thống", "Văn hóa nước ngoài", "Văn hóa học hỏi", "Văn hóa hiện đại"], "answer": 3}, {"q": "Nội dung nào sau đây KHÔNG PHẢI là triết lý hoạt động của Sun Group?", "opts": ["Triết lý về sự hài hòa", "Triết lý về lòng yêu nước", "Triết lý ​ \"Đứng trên vai người khổng lồ\"", "Triết lý về sự nhân văn"], "answer": 3}, {"q": "Giá trị cốt lõi của TĐ Sun Group bao gồm mấy yếu tố?", "opts": ["5 yếu tố", "3 yếu tố", "4 yếu tố", "6 yếu tố"], "answer": 1}, {"q": "Nội dung sau đây thể hiện giá trị cốt lõi nào đối với Tập đoàn Sun Group: \"Sản phẩm/dịch vụ được công nhận bởi các tổ chức quốc tế có uy tín và được sự ghi nhận, trân trọng của cộng đồng trong nước và quốc tế\"?", "opts": ["Khác biệt", "Không thể hiện giá trị cốt lõi nào đối với Tập đoàn", "Đẳng cấp", "Chất lượng"], "answer": 2}, {"q": "Người Sun Group không tự mãn với những thành công đã đạt được mà luôn khao khát phá vỡ những kỷ lục của chính mình, luôn đảm bảo chất lượng, đẳng cấp, khác biệt và tính nhân văn trong mọi việc, công trình sau tốt hơn công trình trước; Đây là nội dung thể hiện yếu tố nào trong Triết lý xây dựng và phát triển văn hóa của Sun Group?", "opts": ["Lan tỏa", "Hội nhập", "Bản sắc", "Kế thừa"], "answer": 2}, {"q": "Nội dung sau đây thể hiện yếu tố nào trong Phẩm chất của Người Sun Group trong thời kì mới? \"Có lý tưởng, khát vọng, kỷ luật, trách nhiệm, quyết tâm thay đổi những gì mình đang có, hướng tới những thay đổi vượt bậc và những giá trị tốt đẹp hơn.\"", "opts": ["Nhân cách tốt.", "Lý tưởng.", "Khiêm nhường.", "Yêu nước."], "answer": 1}, {"q": "Trong nội dung Đối với tập thể Người Sun Group có nêu rõ Người Sun Group dù đang ở bất cứ vị trí nào, thực hiện bất cứ công việc nào cũng sẽ luôn nỗ lực hết mình để hoàn thành xuất sắc vai trò, nhiệm vụ của mình. Bởi lẽ, Người Sun Group luôn cho rằng “…..........”; thành công chung của Tập đoàn được đóng góp từ tất cả các cá nhân ở mọi vị trí.\" Câu còn thiếu trong dấu ba chấm là gì?", "opts": ["Sun Group là tập thể của những người con yêu nước.", "Hạnh phúc của Người Sun Group là trên những chặng đường cống hiến chứ không chỉ là đích đến.", "Không có công việc tầm thường, chỉ có con người tầm thường.", "Thành công của đồng nghiệp cũng là thành công của bản thân mình và là thành công chung của cả Tập đoàn."], "answer": 2}, {"q": "Nội dung sau đây thể hiện triết lý hoạt động nào của Sun Group? \"Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc để mỗi con người – không chỉ Người Sun Group, mà là người Việt Nam luôn có thể tự hào khi bước ra thế giới.\"", "opts": ["Triết lý đứng trên vai người khổng lồ", "Triết lý về sự hài hòa", "Triết lý về tinh thần tự hào Sun Group", "Triết lý về lòng yêu nước"], "answer": 3}, {"q": "Mang trên mình sứ mệnh Người Khai Mở, một trong những mục tiêu Sun Group kiên định là Góp phần nâng cao vị thế đất nước, nâng cao chất lượng sống của người dân, làm đẹp, làm giàu cho Tổ quốc và đưa Việt Nam trở thành điểm đến như thế nào?", "opts": ["Hấp dẫn của thế giới.", "Có nhiều công trình kỷ lục thế giới.", "Có nhiều công trình ghi dấu ấn vượt thời gian.", "Hấp dẫn nhất thế giới"], "answer": 0}, {"q": "CBLĐ/CBQL Sun Group bên cạnh việc là tấm gương về tinh thần kỷ luật, thể hiện rõ nét vai trò/trách nhiệm của người đứng đầu; biết lắng nghe, khích lệ, truyền cảm hứng để đội ngũ cùng chung vai góp sức đạt mục tiêu chung thì còn cần thể hiện điều gì?", "opts": ["Là chỗ dựa cho nhân viên - lực đẩy cho sự phát triển của tổ chức", "Là niềm tin - chỗ dựa cho nhân viên, luôn thể hiện sự nhân văn, yêu thương với CBNV trong mọi hoàn cảnh", "Là niềm tin - chỗ dựa cho nhân viên, bao bọc cho nhân viên nếu mắc lỗi sai; động viên đội ngũ khi nỗ lực hết sức mà kết quả chưa tốt", "Là tấm gương về năng lực chuyên môn vượt trội để có thể hướng dẫn cho nhân viên những kỹ thuật sâu trong chuyên môn mà nhân viên chưa giỏi"], "answer": 0}, {"q": "Yêu cầu về Sức khỏe (Thể chất – Tinh thần) của Người Sun Group trong thời kì mới bao gồm những yếu tố nào?", "opts": ["Ý thức tốt - Nhân cách tốt - Tinh thần tốt.", "Sức khỏe tốt - Tinh thần tốt - Lối sống tốt.", "Thể chất khỏe mạnh - Tinh thần khỏe mạnh - Năng suất lao động cao.", "Thể chất khỏe mạnh - Tinh thần khỏe mạnh - Lối sống lành mạnh."], "answer": 3}, {"q": "Hoạt động đầu tư và kinh doanh của Sun Group phải luôn đảm bảo được mấy triết lý?", "opts": ["2", "4", "3", "1"], "answer": 2}, {"q": "Nội dung nào sau đây thể hiện giá trị cốt lõi \"Khác biệt\" của Tập đoàn Sun Group?", const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let done=0,correct=0;
function update(){ $('done').textContent=`Đã làm: ${done}/${BANK.length}`;$('score').textContent=`Đúng: ${correct}/${done || 0}`;$('bar').style.width=(done/BANK.length*100)+'%';}
function render(){done=0;correct=0;$('total').textContent=`Tổng số ${BANK.length} câu hỏi · Trắc nghiệm 4 lựa chọn`;$('questions').replaceChildren();let order=shuffle(BANK.map((q,i)=>({...q,id:i})));order.forEach((q,n)=>{
const card=document.createElement('article');card.className='question';const title=document.createElement('div');title.className='qtitle';title.textContent=`Câu ${n+1}. ${q.q}`;card.append(title);
const choices=document.createElement('div');choices.className='choices';const feedback=document.createElement('div');feedback.className='feedback';let indices=shuffle(q.opts.map((_,i)=>i));let buttons=[];
indices.forEach((orig,k)=>{const btn=document.createElement('button');btn.className='choice';btn.type='button';const letter=document.createElement('span');letter.className='letter';letter.textContent='ABCD'[k]+'.';const label=document.createElement('span');label.textContent=q.opts[orig];btn.append(letter,label);btn.addEventListener('click',()=>{if(buttons.some(b=>b.disabled))return;done++;if(orig===q.answer)correct++;buttons.forEach((b)=>{b.disabled=true;if(Number(b.dataset.orig)===q.answer)b.classList.add('correct');});if(orig!==q.answer)btn.classList.add('wrong');feedback.className='feedback '+(orig===q.answer?'good':'bad');feedback.textContent=orig===q.answer?'✓ Chính xác!':`✗ Chưa đúng. Đáp án đúng: ${'ABCD'[indices.indexOf(q.answer)]}. ${q.opts[q.answer]}`;update();});btn.dataset.orig=orig;buttons.push(btn);choices.append(btn);});card.append(choices,feedback);$('questions').append(card);});update();}
$('restart').addEventListener('click',()=>{render();window.scrollTo({top:0,behavior:'smooth'});});render();
</script></body></html>
